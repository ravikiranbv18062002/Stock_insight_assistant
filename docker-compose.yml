services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockadmin
      POSTGRES_PASSWORD: stockpassword
      POSTGRES_DB: stockdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: